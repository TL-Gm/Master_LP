<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Verfüllung von Hohlräumen – schematischer Querschnitt">
<defs>
  <pattern id="hrboden" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#EFE9DD"/><line x1="0" y1="0" x2="0" y2="12" stroke="#C5B9A2" stroke-width="1.4"/>
  </pattern>
  <pattern id="hrfb" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#FFD6A8"/><circle cx="2.5" cy="2.5" r="1.1" fill="#E8870C"/><circle cx="7" cy="7" r="0.8" fill="#E8870C"/>
  </pattern>
  <pattern id="hrbeton" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#DCDEE1"/><circle cx="3" cy="4" r="1" fill="#8E949C"/><path d="M9 9 l2 -3 l2 3 z" fill="none" stroke="#8E949C" stroke-width="0.8"/>
  </pattern>
  <pattern id="hrschotter" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#E4E4E4"/><circle cx="3" cy="3" r="1.8" fill="none" stroke="#9A9EA5" stroke-width="0.8"/><circle cx="8" cy="7.5" r="1.3" fill="none" stroke="#9A9EA5" stroke-width="0.8"/>
  </pattern>
  <pattern id="hrverbau" width="8" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="16" fill="#7A8089"/><path d="M0 0 L8 8 L0 16" fill="none" stroke="#4E535B" stroke-width="1"/>
  </pattern>
  <marker id="hrpfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#B8650A"/>
  </marker>
</defs>
<rect width="800" height="480" fill="#fff"/>
<text x="40" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="22" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Verfüllung von Hohlräumen</text>
<text x="40" y="64" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#666" font-weight="400" text-anchor="start" font-style="normal">Querschnitt durch einen stillgelegten Hohlraum</text>
<text x="780" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#888" font-weight="400" text-anchor="end" font-style="italic">schematisch, ohne Maßstab</text>

<rect x="40" y="110" width="500" height="320" fill="url(#hrboden)"/>
<rect x="110" y="215" width="350" height="160" fill="url(#hrbeton)" stroke="#2B2F36" stroke-width="2"/>
<rect x="130" y="235" width="310" height="120" fill="url(#hrfb)" stroke="#2B2F36" stroke-width="1.6"/>
<rect x="400" y="110" width="16" height="125" fill="#fff" stroke="#2B2F36" stroke-width="1.6"/>
<rect x="176" y="96" width="12" height="139" fill="#fff" stroke="#2B2F36" stroke-width="1.6"/>
<path d="M170 96 h24" stroke="#2B2F36" stroke-width="2"/>
<rect x="452" y="74" width="86" height="36" rx="3" fill="#5C626B" stroke="#2B2F36" stroke-width="1.6"/>
<text x="495" y="97" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" font-style="normal">Pumpe</text>
<path d="M452 92 C 420 92, 408 80, 408 112" fill="none" stroke="#E8870C" stroke-width="5" stroke-linecap="round"/>
<line x1="408" y1="118" x2="408" y2="228" stroke="#E8870C" stroke-width="5"/>
<line x1="390" y1="295" x2="335" y2="295" stroke="#B8650A" stroke-width="2.2" marker-end="url(#hrpfeil)"/>
<line x1="315" y1="295" x2="255" y2="295" stroke="#B8650A" stroke-width="2.2" marker-end="url(#hrpfeil)"/>
<line x1="235" y1="295" x2="175" y2="295" stroke="#B8650A" stroke-width="2.2" marker-end="url(#hrpfeil)"/>
<line x1="40" y1="110" x2="540" y2="110" stroke="#2B2F36" stroke-width="2"/>
<line x1="566" y1="107" x2="520" y2="104" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="520" cy="104" r="3" fill="#2B2F36"/>
<circle cx="582" cy="107" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="111.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">1</text>
<text x="600" y="112" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Pumpe</text>
<text x="600" y="130" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">fördert den Flüssigboden</text>
<text x="600" y="146" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">über einen Schlauch</text>
<line x1="566" y1="181" x2="416" y2="170" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="416" cy="170" r="3" fill="#2B2F36"/>
<circle cx="582" cy="181" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="185.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">2</text>
<text x="600" y="186" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Einfüllöffnung</text>
<line x1="566" y1="245" x2="188" y2="232" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="188" cy="232" r="3" fill="#2B2F36"/>
<circle cx="582" cy="245" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="249.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">3</text>
<text x="600" y="250" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Entlüftung</text>
<text x="600" y="268" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">die Luft entweicht beim</text>
<text x="600" y="284" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">Füllen</text>
<line x1="566" y1="329" x2="300" y2="322" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="300" cy="322" r="3" fill="#2B2F36"/>
<circle cx="582" cy="329" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="333.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">4</text>
<text x="600" y="334" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Flüssigboden</text>
<text x="600" y="352" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">fließt in jeden Winkel und</text>
<text x="600" y="368" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">füllt den Hohlraum</text>
<text x="600" y="384" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">vollständig</text>
<line x1="566" y1="399" x2="450" y2="365" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="450" cy="365" r="3" fill="#2B2F36"/>
<circle cx="582" cy="399" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="403.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">5</text>
<text x="600" y="404" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Hohlraum</text>
<text x="600" y="422" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">z. B. stillgelegter Tunnel,</text>
<text x="600" y="438" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">Becken oder Schacht</text>

<line x1="40" y1="440" x2="780" y2="440" stroke="#E2E2E2" stroke-width="1"/>
<rect x="40" y="451" width="22" height="14" fill="url(#hrfb)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="70" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Flüssigboden</text>
<rect x="180" y="451" width="22" height="14" fill="url(#hrboden)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="210" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Gewachsener Boden</text>
<rect x="355" y="451" width="22" height="14" fill="url(#hrbeton)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="385" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Beton</text>
</svg>