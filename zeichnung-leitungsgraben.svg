<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Verfüllung von Leitungsgräben – schematischer Querschnitt">
<defs>
  <pattern id="lgboden" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#EFE9DD"/><line x1="0" y1="0" x2="0" y2="12" stroke="#C5B9A2" stroke-width="1.4"/>
  </pattern>
  <pattern id="lgfb" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#FFD6A8"/><circle cx="2.5" cy="2.5" r="1.1" fill="#E8870C"/><circle cx="7" cy="7" r="0.8" fill="#E8870C"/>
  </pattern>
  <pattern id="lgbeton" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#DCDEE1"/><circle cx="3" cy="4" r="1" fill="#8E949C"/><path d="M9 9 l2 -3 l2 3 z" fill="none" stroke="#8E949C" stroke-width="0.8"/>
  </pattern>
  <pattern id="lgschotter" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#E4E4E4"/><circle cx="3" cy="3" r="1.8" fill="none" stroke="#9A9EA5" stroke-width="0.8"/><circle cx="8" cy="7.5" r="1.3" fill="none" stroke="#9A9EA5" stroke-width="0.8"/>
  </pattern>
  <pattern id="lgverbau" width="8" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="16" fill="#7A8089"/><path d="M0 0 L8 8 L0 16" fill="none" stroke="#4E535B" stroke-width="1"/>
  </pattern>
  <marker id="lgpfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#B8650A"/>
  </marker>
</defs>
<rect width="800" height="480" fill="#fff"/>
<text x="40" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="22" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Verfüllung von Leitungsgräben</text>
<text x="40" y="64" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#666" font-weight="400" text-anchor="start" font-style="normal">Querschnitt durch einen Leitungsgraben</text>
<text x="780" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#888" font-weight="400" text-anchor="end" font-style="italic">schematisch, ohne Maßstab</text>

<rect x="40" y="150" width="500" height="280" fill="url(#lgboden)"/>
<rect x="40" y="110" width="500" height="12" fill="#4A4F57"/>
<rect x="40" y="122" width="500" height="28" fill="url(#lgschotter)"/>
<rect x="250" y="150" width="220" height="250" fill="url(#lgfb)" stroke="#2B2F36" stroke-width="2"/>
<circle cx="305" cy="350" r="32" fill="#F6F6F6" stroke="#2B2F36" stroke-width="2.2"/><circle cx="305" cy="350" r="28" fill="none" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="375" cy="356" r="24" fill="#F6F6F6" stroke="#2B2F36" stroke-width="2.2"/><circle cx="375" cy="356" r="20" fill="none" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="428" cy="364" r="15" fill="#F6F6F6" stroke="#2B2F36" stroke-width="2.2"/><circle cx="428" cy="364" r="11" fill="none" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="398" cy="292" r="7" fill="#2B2F36"/><circle cx="413" cy="292" r="7" fill="#2B2F36"/><circle cx="405.5" cy="279" r="7" fill="#2B2F36"/>
<circle cx="300" cy="280" r="9" fill="#F6F6F6" stroke="#2B2F36" stroke-width="2"/>
<line x1="40" y1="110" x2="540" y2="110" stroke="#2B2F36" stroke-width="2"/>
<line x1="40" y1="430" x2="540" y2="430" stroke="#E2E2E2"/>
<line x1="566" y1="107" x2="515" y2="120" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="515" cy="120" r="3" fill="#2B2F36"/>
<circle cx="582" cy="107" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="111.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">1</text>
<text x="600" y="112" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Straßenoberbau</text>
<text x="600" y="130" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">Asphalt und Tragschicht</text>
<text x="600" y="146" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">werden wieder hergestellt</text>
<line x1="566" y1="181" x2="300" y2="210" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="300" cy="210" r="3" fill="#2B2F36"/>
<circle cx="582" cy="181" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="185.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">2</text>
<text x="600" y="186" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Flüssigboden</text>
<text x="600" y="204" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">füllt den Graben und</text>
<text x="600" y="220" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">umschließt alle Leitungen</text>
<text x="600" y="236" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">porenfrei</text>
<line x1="566" y1="257" x2="413" y2="292" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="413" cy="292" r="3" fill="#2B2F36"/>
<circle cx="582" cy="257" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="261.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">3</text>
<text x="600" y="262" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Rohre und Kabel</text>
<text x="600" y="280" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">auch viele Leitungen auf</text>
<text x="600" y="296" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">engem Raum</text>
<line x1="566" y1="325" x2="510" y2="330" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="510" cy="330" r="3" fill="#2B2F36"/>
<circle cx="582" cy="325" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="329.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">4</text>
<text x="600" y="330" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Gewachsener Boden</text>
<line x1="566" y1="385" x2="440" y2="400" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="440" cy="400" r="3" fill="#2B2F36"/>
<circle cx="582" cy="385" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="389.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">5</text>
<text x="600" y="390" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Grabensohle</text>
<text x="600" y="408" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">kein Verdichten im Graben</text>
<text x="600" y="424" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">nötig</text>

<line x1="40" y1="440" x2="780" y2="440" stroke="#E2E2E2" stroke-width="1"/>
<rect x="40" y="451" width="22" height="14" fill="url(#lgfb)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="70" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Flüssigboden</text>
<rect x="180" y="451" width="22" height="14" fill="url(#lgboden)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="210" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Gewachsener Boden</text>
<rect x="355" y="451" width="22" height="14" fill="url(#lgschotter)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="385" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Tragschicht</text>
<rect x="488" y="451" width="22" height="14" fill="#4A4F57"/>
<text x="518" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Asphalt</text>
</svg>