<text x="600" y="404" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Grabensohle</text>

<line x1="40" y1="440" x2="780" y2="440" stroke="#E2E2E2" stroke-width="1"/>
