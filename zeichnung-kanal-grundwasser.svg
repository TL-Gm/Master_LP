<text x="600" y="186" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Grundwasserspiegel</text>
<line x1="566" y1="247" x2="468" y2="300" stroke="#2B2F36" stroke-width="0.9"/>
