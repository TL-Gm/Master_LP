<rect x="355" y="451" width="22" height="14" fill="url(#kgbeton)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="385" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Beton</text>
<rect x="446" y="451" width="22" height="14" fill="url(#kgverbau)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="476" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Verbau</text>
