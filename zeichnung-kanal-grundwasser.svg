<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Kanalbau im Grundwasser – schematischer Querschnitt">
<defs>
  <pattern id="kgboden" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#EFE9DD"/><line x1="0" y1="0" x2="0" y2="12" stroke="#C5B9A2" stroke-width="1.4"/>
  </pattern>
  <pattern id="kgfb" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#FFD6A8"/><circle cx="2.5" cy="2.5" r="1.1" fill="#E8870C"/><circle cx="7" cy="7" r="0.8" fill="#E8870C"/>
  </pattern>
  <pattern id="kgbeton" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#DCDEE1"/><circle cx="3" cy="4" r="1" fill="#8E949C"/><path d="M9 9 l2 -3 l2 3 z" fill="none" stroke="#8E949C" stroke-width="0.8"/>
  </pattern>
  <pattern id="kgschotter" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#E4E4E4"/><circle cx="3" cy="3" r="1.8" fill="none" stroke="#9A9EA5" stroke-width="0.8"/><circle cx="8" cy="7.5" r="1.3" fill="none" stroke="#9A9EA5" stroke-width="0.8"/>
  </pattern>
  <pattern id="kgverbau" width="8" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="16" fill="#7A8089"/><path d="M0 0 L8 8 L0 16" fill="none" stroke="#4E535B" stroke-width="1"/>
  </pattern>
  <marker id="kgpfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#B8650A"/>
  </marker>
</defs>
<rect width="800" height="480" fill="#fff"/>
<text x="40" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="22" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Kanalbau im Grundwasser</text>
<text x="40" y="64" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#666" font-weight="400" text-anchor="start" font-style="normal">Querschnitt durch einen Kanalgraben mit Verbau</text>
<text x="780" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#888" font-weight="400" text-anchor="end" font-style="italic">schematisch, ohne Maßstab</text>

<rect x="40" y="110" width="500" height="320" fill="url(#kgboden)"/>
<rect x="282" y="110" width="216" height="160" fill="#F6F1E7"/>
