<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Arbeitsraumverfüllung – schematischer Querschnitt">
<defs>
  <pattern id="arboden" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="#EFE9DD"/><line x1="0" y1="0" x2="0" y2="12" stroke="#C5B9A2" stroke-width="1.4"/>
  </pattern>
  <pattern id="arfb" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#FFD6A8"/><circle cx="2.5" cy="2.5" r="1.1" fill="#E8870C"/><circle cx="7" cy="7" r="0.8" fill="#E8870C"/>
  </pattern>
  <pattern id="arbeton" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#DCDEE1"/><circle cx="3" cy="4" r="1" fill="#8E949C"/><path d="M9 9 l2 -3 l2 3 z" fill="none" stroke="#8E949C" stroke-width="0.8"/>
  </pattern>
  <pattern id="arschotter" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#E4E4E4"/><circle cx="3" cy="3" r="1.8" fill="none" stroke="#9A9EA5" stroke-width="0.8"/><circle cx="8" cy="7.5" r="1.3" fill="none" stroke="#9A9EA5" stroke-width="0.8"/>
  </pattern>
  <pattern id="arverbau" width="8" height="16" patternUnits="userSpaceOnUse">
    <rect width="8" height="16" fill="#7A8089"/><path d="M0 0 L8 8 L0 16" fill="none" stroke="#4E535B" stroke-width="1"/>
  </pattern>
  <marker id="arpfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#B8650A"/>
  </marker>
</defs>
<rect width="800" height="480" fill="#fff"/>
<text x="40" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="22" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Arbeitsraumverfüllung</text>
<text x="40" y="64" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#666" font-weight="400" text-anchor="start" font-style="normal">Querschnitt an einer Kellerwand</text>
<text x="780" y="42" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#888" font-weight="400" text-anchor="end" font-style="italic">schematisch, ohne Maßstab</text>

<polygon points="470,110 540,110 540,430 275,430 275,400 334,400" fill="url(#arboden)"/>
<polygon points="259,110 470,110 463,125 259,125" fill="url(#arboden)"/>
<polygon points="259,125 463,125 334,400 259,400" fill="url(#arfb)" stroke="#2B2F36" stroke-width="2"/>
<rect x="220" y="80" width="36" height="320" fill="url(#arbeton)" stroke="#2B2F36" stroke-width="2"/>
<rect x="40" y="400" width="235" height="30" fill="url(#arbeton)" stroke="#2B2F36" stroke-width="2"/>
<line x1="258" y1="112" x2="258" y2="400" stroke="#1E2228" stroke-width="3.5"/>
<text x="130" y="250" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#9A9EA5" font-weight="400" text-anchor="middle" font-style="italic">Untergeschoss</text>
<line x1="256" y1="110" x2="540" y2="110" stroke="#2B2F36" stroke-width="2"/>
<line x1="470" y1="110" x2="334" y2="400" stroke="#2B2F36" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="566" y1="107" x2="520" y2="110" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="520" cy="110" r="3" fill="#2B2F36"/>
<circle cx="582" cy="107" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="111.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">1</text>
<text x="600" y="112" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Geländeoberkante</text>
<line x1="566" y1="167" x2="240" y2="180" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="240" cy="180" r="3" fill="#2B2F36"/>
<circle cx="582" cy="167" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="171.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">2</text>
<text x="600" y="172" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Kellerwand</text>
<text x="600" y="190" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">mit Abdichtung an der</text>
<text x="600" y="206" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">Außenseite</text>
<line x1="566" y1="243" x2="320" y2="255" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="320" cy="255" r="3" fill="#2B2F36"/>
<circle cx="582" cy="243" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="247.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">3</text>
<text x="600" y="248" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Arbeitsraum</text>
<text x="600" y="266" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">mit Flüssigboden verfüllt –</text>
<text x="600" y="282" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">ohne Verdichten, auch an</text>
<text x="600" y="298" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">schwer zugänglichen Stellen</text>
<line x1="566" y1="331" x2="465" y2="320" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="465" cy="320" r="3" fill="#2B2F36"/>
<circle cx="582" cy="331" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="335.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">4</text>
<text x="600" y="336" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Böschung</text>
<text x="600" y="354" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#555" font-weight="400" text-anchor="start" font-style="normal">gewachsener Boden</text>
<line x1="566" y1="399" x2="160" y2="415" stroke="#2B2F36" stroke-width="0.9"/>
<circle cx="160" cy="415" r="3" fill="#2B2F36"/>
<circle cx="582" cy="399" r="11" fill="#fff" stroke="#2B2F36" stroke-width="1.2"/>
<text x="582" y="403.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#2B2F36" font-weight="700" text-anchor="middle" font-style="normal">5</text>
<text x="600" y="404" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Bodenplatte</text>

<line x1="40" y1="440" x2="780" y2="440" stroke="#E2E2E2" stroke-width="1"/>
<rect x="40" y="451" width="22" height="14" fill="url(#arfb)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="70" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Flüssigboden</text>
<rect x="180" y="451" width="22" height="14" fill="url(#arboden)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="210" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Gewachsener Boden</text>
<rect x="355" y="451" width="22" height="14" fill="url(#arbeton)" stroke="#2B2F36" stroke-width="0.8"/>
<text x="385" y="462.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.5" fill="#444" font-weight="400" text-anchor="start" font-style="normal">Beton</text>
</svg>